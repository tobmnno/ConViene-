name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/scraper_api/requirements.txt
      - name: Install backend dependencies
        working-directory: backend/scraper_api
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/scraper_api/tests -q

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.5"
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test
      - name: Build web release
        run: >-
          flutter build web --release
          --dart-define=CONVIENE_API_BASE_URL=https://api.invalid.example
          --dart-define=SUPABASE_URL=https://project.invalid.example
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder

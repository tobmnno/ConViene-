name: conviene
description: Conviene compares supermarket prices and discounts for Argentine shoppers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/conviene_logo.png
    - assets/logos/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
